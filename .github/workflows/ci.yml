# CA-010：CI 质量门。
# - quality job（PR 必过）：typecheck + gen-types 漂移检查 + 单测；
# - integration job（optional，continue-on-error）：真实 herdr 集成；
#   无 herdr/未启动 server 时 test/integration/*.mjs 会打印 SKIPPED 并退出 0（CA-009）。
# 触发：push 仅限 main；PR 分支只走 pull_request 事件，避免同一提交重复跑两遍。
name: ci

on:
  push:
    branches: [main]
  pull_request:

# 同一分支/PR 的旧 run 作废，避免排队堆积
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate (typecheck + gen-types + unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Generated types drift check
        run: pnpm gen:types:check
      - name: Unit tests
        run: pnpm test

  integration:
    name: Integration (real herdr, optional)
    runs-on: ubuntu-latest
    # 真实 herdr 环境不是每次 PR 都可用：失败不阻塞合并，但输出会暴露问题
    continue-on-error: true
    # 兜底：herdr server 是前台常驻进程，step 绝不能无限卡住（PR#1 曾卡 45 分钟被手动取消）
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install herdr CLI (best effort)
        run: |
          curl -fsSL https://herdr.dev/install.sh | sh || echo 'herdr install failed (integration will SKIP)'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Start herdr server in background (best effort)
        run: |
          if ! command -v herdr >/dev/null 2>&1; then
            echo 'herdr CLI missing (integration will SKIP)'
            exit 0
          fi
          herdr server >/tmp/herdr-server.log 2>&1 &
          echo "herdr server pid: $!"
          # 轮询最多 60s 等 server 就绪；就绪失败不报错，集成脚本会自行 SKIP（CA-009）
          for i in $(seq 1 60); do
            if herdr status server --json 2>/dev/null | grep -q '"running": *true'; then
              echo "herdr server is running (after ${i}s)"
              exit 0
            fi
            sleep 1
          done
          echo 'herdr server did not become ready (integration will SKIP)'
          exit 0
      - name: Integration tests
        run: pnpm test:integration
